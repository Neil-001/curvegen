pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'curvegen'

// The shared code is in the root src/ folder. Each loader's project compiles it together with its own entrypoints.
include 'fabric'
include 'neoforge'
