plugins {
	id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
	// Chroma Studio's releases are GitHub release files, read as an Ivy repository.
	exclusiveContent {
		forRepository {
			ivy {
				name = 'Chroma Studio releases'
				url = 'https://github.com/Neil-001/chroma-studio/releases/download/'
				patternLayout { artifact '[revision]+mc1.21.11/[module]-[revision].[ext]' }
				metadataSources { artifact() }
			}
		}
		filter { includeGroup 'dev.chromastudio' }
	}
}

dependencies {
	// Chroma Studio is optional: only dev.curvegen.client.chroma.ChromaBridge refers to it, and only once it is loaded.
	compileOnly "dev.chromastudio:chromastudio-neoforge:${project.chromastudio_version}"
	// -PwithChroma runs the dev client with it.
	if (project.hasProperty('withChroma')) runtimeOnly "dev.chromastudio:chromastudio-neoforge:${project.chromastudio_version}"
}

neoForge {
	version = project.neoforge_version
	runs {
		client {
			client()
			gameDirectory = rootProject.file('run/neoforge')
		}
		server {
			server()
			programArgument '--nogui'
			gameDirectory = rootProject.file('run/neoforge-server')
		}
	}
	mods {
		"curvegen" {
			sourceSet sourceSets.main
		}
	}
}

// The shared code, next to this project's own NeoForge entrypoints. NeoForge has no separate client source set,
// so the client code goes into the same jar.
sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		java.srcDir rootProject.file('src/client/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}
