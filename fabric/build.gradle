plugins {
	// Loom 1.18 and later need Java 25 to run Gradle. The release workflow builds this branch with Java 21.
	id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	// Chroma Studio's releases are GitHub release files, read as an Ivy repository.
	exclusiveContent {
		forRepository {
			ivy {
				name = 'Chroma Studio releases'
				url = 'https://github.com/Neil-001/chroma-studio/releases/download/'
				patternLayout { artifact '[revision]+mc1.21.11/[module]-[revision].[ext]' }
				metadataSources { artifact() }
			}
		}
		filter { includeGroup 'dev.chromastudio' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"curvegen" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client { runDir = '../run/fabric' }
		server { runDir = '../run/fabric-server' }
	}
}

// The shared code, next to this project's own Fabric entrypoints.
sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
	client {
		java.srcDir rootProject.file('src/client/java')
	}
	test {
		java.srcDir rootProject.file('src/test/java')
		// For the client classes that don't need the game running, such as ModSettings.
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 is obfuscated, so the code uses Mojang's names and Loom remaps the jar to the game's.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Mod Menu is optional: only its entrypoint class refers to it, and only Mod Menu loads that class.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Chroma Studio is optional too: only dev.curvegen.client.chroma.ChromaBridge refers to it, and only once it is loaded.
	// Its 1.21.11 jar is in intermediary names like any released Fabric mod, so Loom remaps it.
	modCompileOnly "dev.chromastudio:chromastudio-fabric:${project.chromastudio_version}"
	// -PwithChroma runs the dev client with it.
	if (project.hasProperty('withChroma')) modLocalRuntime "dev.chromastudio:chromastudio-fabric:${project.chromastudio_version}"

	// Tests cover the pure-Java core (dev.curvegen.core) and the settings file. GameRules3Test also loads Minecraft's blocks, without a world or client.
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat = "full"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
