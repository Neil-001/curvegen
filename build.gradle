// Settings both loader projects share. The plugins and dependencies are in fabric/ and neoforge/.
subprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group

	plugins.withId('java') {
		base {
			archivesName = "${rootProject.archives_base_name}-${project.name}"
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = 25
			// Every warning but the ones about the libraries' own class files, which nothing here can fix.
			it.options.compilerArgs += ['-Xlint:all,-classfile']
		}

		java {
			sourceCompatibility = JavaVersion.VERSION_25
			targetCompatibility = JavaVersion.VERSION_25
		}
	}
}
