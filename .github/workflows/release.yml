name: Release
run-name: ${{ inputs.planned_release && fromJSON(inputs.planned_release).run_name || 'Release' }}

# Publishes each selected branch to Modrinth, CurseForge and GitHub releases. */stable branches release, and
# so does main in a repository whose variable RELEASE_MAIN is true: one that publishes its newest Minecraft
# line straight from main instead of promoting it to a stable branch first.
# The version comes from the branch's source. A branch whose version is already tagged is skipped.
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Branches to release, comma-separated, or "all" for every */stable branch. Left empty, it is main where main releases and "all" elsewhere
        default: ''
      targets:
        description: Sites to publish to. Narrow this to retry a release that failed part-way
        default: modrinth,curseforge,github
      dry_run:
        description: Build and show what would be published, without publishing
        type: boolean
        default: false
      planned_release:
        description: Release entry supplied by the workflow
        default: ''

# The sequence and its individual releases need separate locks.
concurrency:
  group: ${{ inputs.planned_release == '' && 'release' || 'release-line' }}

permissions:
  contents: read

jobs:
  plan:
    if: inputs.planned_release == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every branch and tag

      - name: Check the targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          for target in ${TARGETS//,/ }; do
            case $target in
              modrinth|curseforge|github) ;;
              *) echo "::error::Unknown target \"$target\". Use modrinth, curseforge or github."; exit 1 ;;
            esac
          done

      - id: plan
        env:
          BRANCHES: ${{ inputs.branches }}
          RELEASE_MAIN: ${{ vars.RELEASE_MAIN }}
        run: |
          plan=$(.github/scripts/release-plan.sh "$BRANCHES")
          echo "branches=$plan" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            jq -r 'if length == 0 then "Nothing to release. Every selected branch is already tagged."
                   else .[] | "- `\(.branch)` as `\(.tag)`" end' <<< "$plan"
          } >> "$GITHUB_STEP_SUMMARY"

  release-in-order:
    needs: plan
    if: needs.plan.outputs.branches != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Release one line at a time
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN: ${{ needs.plan.outputs.branches }}
          TARGETS: ${{ inputs.targets }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          run_id=
          run_name=
          dispatch_pid=
          dispatch_result=$(mktemp)
          cancel_release() {
            trap '' INT TERM
            if [[ -n "$dispatch_pid" ]]; then
              kill "$dispatch_pid" 2>/dev/null || true
            fi
            rm -f "$dispatch_result"
            if [[ -n "$run_name" && -z "$run_id" ]]; then
              run_id=$(timeout -k 1s 2s gh api -X GET "repos/$GH_REPO/actions/workflows/release.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f event=workflow_dispatch -F per_page=100 |
                jq -r --arg name "$run_name" '[.workflow_runs[] | select(.display_title == $name)][0].id // empty') || true
            fi
            if [[ -n "$run_id" ]]; then
              timeout -k 1s 2s gh run cancel "$run_id" || true
            fi
          }
          trap cancel_release EXIT
          trap 'exit 1' INT TERM
          echo "### Release runs" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r entry; do
            tag=$(jq -r '.tag' <<< "$entry")
            branch=$(jq -r '.branch' <<< "$entry")
            parent="$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            run_name="$tag ($branch, $parent)"
            planned=$(jq -c --arg sha "$GITHUB_SHA" --arg name "$run_name" --arg parent "$parent" \
              '. + {workflow_sha: $sha, run_name: $name, parent: $parent}' <<< "$entry")
            request=$(jq -cn --arg ref "$GITHUB_REF_NAME" --arg planned "$planned" \
              --arg targets "$TARGETS" --argjson dry_run "$DRY_RUN" \
              '{ref: $ref, inputs: {planned_release: $planned, targets: $targets, dry_run: $dry_run}}')
            timeout 10s gh api -X POST -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GH_REPO/actions/workflows/release.yml/dispatches" --input - \
              --jq '.workflow_run_id // empty' <<< "$request" > "$dispatch_result" &
            dispatch_pid=$!
            wait "$dispatch_pid"
            dispatch_pid=
            read -r run_id < "$dispatch_result"
            url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id"
            printf -- '- [`%s`](%s)\n' "$tag" "$url" >> "$GITHUB_STEP_SUMMARY"
            errors=0
            while true; do
              if state=$(timeout 5s gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status + ":" + (.conclusion // "")'); then
                if [[ "$state" == completed:* ]]; then
                  run_id=
                  run_name=
                  if [[ "$state" != completed:success ]]; then
                    echo "::error::$tag ended with ${state#completed:}. See $url."
                    exit 1
                  fi
                  break
                fi
                errors=0
              elif (( ++errors == 3 )); then
                echo "::error::Could not check the status of $tag. See $url."
                exit 1
              fi
              sleep 5 &
              wait "$!"
            done
          done < <(jq -c '.[]' <<< "$PLAN")

  check-release:
    if: inputs.planned_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          PLANNED: ${{ inputs.planned_release }}
        run: |
          if [[ "$GITHUB_ACTOR" != 'github-actions[bot]' ]]; then
            echo "::error::Select branches to release from the Release workflow."
            exit 1
          fi
          if [[ "$(jq -r '.workflow_sha' <<< "$PLANNED")" != "$GITHUB_SHA" ]]; then
            echo "::error::The release workflow changed during this sequence. Start a new run."
            exit 1
          fi
          tag=$(jq -er '.tag' <<< "$PLANNED")
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::notice::Skipping $tag because it is already released."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-release
    if: needs.check-release.outputs.needed == 'true'
    name: ${{ fromJSON(inputs.planned_release).tag }}
    permissions:
      contents: write   # creates the tag and the GitHub release
      actions: read     # looks for an earlier run's CurseForge marker
    uses: ./.github/workflows/release-branch.yml
    with:
      line: ${{ fromJSON(inputs.planned_release).line }}
      version: ${{ fromJSON(inputs.planned_release).version }}
      tag: ${{ fromJSON(inputs.planned_release).tag }}
      sha: ${{ fromJSON(inputs.planned_release).sha }}
      parent: ${{ fromJSON(inputs.planned_release).parent }}
      targets: ${{ inputs.targets }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
