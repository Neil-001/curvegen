name: Build

on:
  pull_request:
  push:
    branches: [main, '**/stable']
  workflow_dispatch:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and Loom's Minecraft files. Only runs on main write the cache.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles both loaders' jars and runs the tests, including SolverRegressionTest.
      - run: ./gradlew build

      # Each jar runs on 26.1 to 26.1.2. The build compiles Fabric against the oldest versions and NeoForge against
      # the first stable one, so this compiles each against the other end of its range.
      - run: >
          ./gradlew :fabric:compileJava :fabric:compileClientJava :neoforge:compileJava
          -Pminecraft_version=26.1.2 -Pfabric_version=0.155.3+26.1.2 -Pneoforge_version=26.1.0.19-beta

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: fabric/build/reports/tests/
          retention-days: 7
