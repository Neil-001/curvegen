name: Build

on:
  pull_request:
  push:
    branches: [main, '**/stable']
  workflow_dispatch:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and Loom's Minecraft files. Only runs on main write the cache.
      - uses: gradle/actions/setup-gradle@v6

      - name: Test release scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      # Compiles both loaders' jars and runs the tests, including SolverRegressionTest.
      - run: ./gradlew build

      # The build compiles against the oldest Fabric API and NeoForge the jars accept. This compiles against newer ones.
      - run: >
          ./gradlew :fabric:compileJava :fabric:compileClientJava :neoforge:compileJava
          -Pfabric_version=0.161.0+26.3 -Pneoforge_version=26.3.0.48-beta

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: fabric/build/reports/tests/
          retention-days: 7
