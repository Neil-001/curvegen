name: Build

on:
  pull_request:
  push:
    branches: [main, '**/stable']
  workflow_dispatch:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and Loom's Minecraft files. Only runs on main write the cache.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles the mod and runs the tests, including SolverRegressionTest.
      - run: ./gradlew build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7
