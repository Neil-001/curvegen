org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric: the first Fabric API build for 1.21.1. The jar also accepts 0.100.1+1.21, the first for 1.21, which has
# everything it uses (check https://fabricmc.net/develop for newer builds)
minecraft_version=1.21.1
loader_version=0.19.5
fabric_version=0.101.2+1.21.1
# Mod Menu, compiled against but not required (see https://modrinth.com/mod/modmenu/versions)
modmenu_version=11.0.1
# Chroma Studio, compiled against but not required: 1.2 or newer adds gradients, palettes and its colour matching
# (https://github.com/Neil-001/chroma-studio/releases)
chromastudio_version=1.2.0

# NeoForge: the first stable release for 1.21.1 (see https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.1.1

mod_version=3.0.0
maven_group=dev.curvegen
archives_base_name=curvegen
